<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Text Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Interactive Text Editor</h1>

    <div id="displayArea">HELLO</div>

    <div id="controls">
      <div class="row">
        <button id="boldBtn">Bold</button>
        <button id="italicBtn">Italic</button>
        <button id="leftBtn">Left</button>
        <button id="centerBtn">Center</button>
        <button id="rightBtn">Right</button>
      </div>

      <div class="row">
        <button id="upperBtn">Upper Case</button>
        <button id="lowerBtn">Lower Case</button>
        <button id="capitalizeBtn">Capitalize</button>
        <button id="clearBtn">Clear Text</button>
      </div>

      <div class="row">
        <label for="textColor">Text Color:</label>
        <input type="color" id="textColor" value="#8b0000" />

        <label for="bgColor">Background:</label>
        <input type="color" id="bgColor" value="#00ffff" />
      </div>

      <div class="row">
        <label for="fontSize">Font Size:</label>
        <input type="number" id="fontSize" value="47" />

        <label for="fontFamily">Font:</label>
        <select id="fontFamily">
          <option value="Georgia">Georgia</option>
          <option value="Arial">Arial</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
