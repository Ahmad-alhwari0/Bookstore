<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>score form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Use a Test Score array</h1>

    <div>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" />
    </div>
    <div>
      <label for="score">Score:</label>
      <input type="text" id="score" name="score" />
    </div>

    <div>
      <button id="add_button" type="button">Add to Array</button>
      <button id="display_results_button" type="button">Display Results</button>
      <button id="display_scores_button" type="button">Display Score</button>
      <button id="reset_button" type="button">Reset</button>
    </div>

    <h2 class="heading">Results</h2>

    <div id="results"></div>

    <h2 class="heading">Score</h2>

    <table id="scores_table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script src="app.js"></script>
  </body>
</html>
